<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karipap Arca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Arca tanah liat berbentuk karipap — model 3D fotogrametri, boleh diputar 360°, dizum dan dizum sehingga nampak cap jari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one full-height "studio" stage; the sculpture sits centre, a slim label card
   floats bottom-left like a gallery wall label, controls float bottom-right. */
:root {
  --ground: #e7e5e1;        /* studio backdrop, slightly warm grey */
  --ground-2: #d6d3cd;      /* floor gradient */
  --ink: #1f2124;           /* text */
  --ink-soft: #5c5f64;      /* secondary text */
  --panel: rgba(250, 249, 247, 0.86);
  --line: rgba(31, 33, 36, 0.14);
  --accent: #8a6a3d;        /* fired-clay ochre, used sparingly */
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #26272a; --ground-2: #161719; --ink: #eceae6; --ink-soft: #a5a29c;
    --panel: rgba(30, 31, 34, 0.84); --line: rgba(236, 234, 230, 0.14); --accent: #d2a86c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #26272a; --ground-2: #161719; --ink: #eceae6; --ink-soft: #a5a29c;
  --panel: rgba(30, 31, 34, 0.84); --line: rgba(236, 234, 230, 0.14); --accent: #d2a86c;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 35%, var(--ground) 0%, var(--ground-2) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
}
.stage { position: relative; height: 100%; }
#view {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; outline: none; cursor: grab;
}
#view:active { cursor: grabbing; }
.label {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: min(340px, calc(100% - 32px));
  background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  display: grid; gap: 6px;
}
.label h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: 1.5rem; line-height: 1.05; margin: 0; letter-spacing: -0.01em;
  text-wrap: balance;
}
.label .meta { font-size: 0.8rem; color: var(--ink-soft); line-height: 1.45; margin: 0; }
.label .spec {
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-soft);
  letter-spacing: 0.02em; margin: 0;
}
.hint {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%;
  transform: translateX(-50%);
  font-size: 0.75rem; color: var(--ink-soft);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; white-space: nowrap; max-width: calc(100% - 32px);
  overflow: hidden; text-overflow: ellipsis;
  transition: opacity .6s ease;
}
.hint.gone { opacity: 0; pointer-events: none; }
.controls {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
}
.btn {
  font: 500 0.82rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 14px; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.ar {
  background: var(--ink); color: var(--ground); border-color: var(--ink);
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding: 12px 18px; font-size: 0.9rem;
}
.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 0.85rem; color: var(--ink-soft); pointer-events: none;
}
@media (max-width: 560px) {
  .label { bottom: auto; top: calc(52px + env(safe-area-inset-top, 0px)); padding: 10px 12px; }
  .label h1 { font-size: 1.2rem; }
  .label .meta { display: none; }
  .controls { flex-direction: row; flex-wrap: nowrap; justify-content: center; gap: 6px;
    left: max(16px, env(safe-area-inset-left, 0px)); }
  .controls .btn { padding: 9px 10px; font-size: 0.76rem; gap: 6px; }
  .btn.ar { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<main class="stage">
  <canvas id="view" aria-label="Model 3D arca tanah liat berbentuk karipap. Seret untuk memutar, cubit atau skrol untuk zoom."></canvas>
  <div class="loading" id="loading">Memuatkan model 3D…</div>

  <p class="hint" id="hint">Seret untuk putar 360° · Cubit / skrol untuk zoom · Dua jari untuk gerak</p>

  <section class="label" aria-label="Maklumat arca">
    <h1>Karipap Arca</h1>
    <p class="meta">Arca tanah liat berbentuk karipap. Kesan cap jari, lekuk kelim dan bayang-bayangnya dirakam terus daripada objek sebenar.</p>
    <p class="spec" id="spec">Fotogrametri · 270 imej · ~7.5 cm (anggaran)</p>
  </section>

  <div class="controls">
    <button class="btn" id="rotateBtn" aria-pressed="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Auto-putar
    </button>
    <button class="btn" id="detailBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>
      Lihat cap jari
    </button>
    <button class="btn" id="resetBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
      Set semula
    </button>
  </div>
</main>

<script>
/* three.js viewer. Loads karipap_mesh.json (one relative fetch, arrays as base64,
   decoded here) and karipap_texture.jpg as a plain image: no data:/blob: fetches,
   so it works under a strict Content-Security-Policy. */
(() => {
  const canvas = document.getElementById('view');
  const loading = document.getElementById('loading');
  const hint = document.getElementById('hint');
  const rotateBtn = document.getElementById('rotateBtn');
  const detailBtn = document.getElementById('detailBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fail = (msg) => { loading.hidden = false; loading.textContent = msg; };

  if (!window.THREE || !THREE.OrbitControls) {
    fail('Pemapar 3D tidak dapat dimuatkan. Semak sambungan internet dan muat semula.');
    return;
  }
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (e) {
    fail('Pelayar ini tidak menyokong WebGL, jadi model 3D tidak dapat dipaparkan.');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.001, 10);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 3.0;          // ~18 deg per second
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let fitRadius = 0.05, center = new THREE.Vector3(), homeDist = 0.3;
  let anim = null; // camera flight {from, to, t}
  let interacted = false;

  const sph = (thetaDeg, phiDeg, dist) => {   // model-viewer style orbit
    const t = THREE.MathUtils.degToRad(thetaDeg), p = THREE.MathUtils.degToRad(phiDeg);
    return new THREE.Vector3(Math.sin(p) * Math.sin(t), Math.cos(p), Math.sin(p) * Math.cos(t))
      .multiplyScalar(dist).add(center);
  };
  const flyTo = (pos) => {
    if (reduceMotion) { camera.position.copy(pos); controls.target.copy(center); return; }
    anim = { from: camera.position.clone(), fromT: controls.target.clone(), to: pos, t: 0 };
  };
  const setAuto = (on) => {
    controls.autoRotate = on;
    rotateBtn.setAttribute('aria-pressed', String(on));
  };

  // distance that fits the model in BOTH directions (portrait phones are narrow)
  function fitDist() {
    const v = THREE.MathUtils.degToRad(camera.fov);
    const h = 2 * Math.atan(Math.tan(v / 2) * camera.aspect);
    return fitRadius / Math.sin(Math.min(v, h) / 2) * 1.08;
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (window.__viewerOk) {
      const d = fitDist();
      if (!interacted) camera.position.sub(center).setLength(d).add(center);
      homeDist = d;
      controls.minDistance = d * 0.18; controls.maxDistance = d * 3;
    }
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  function b64(str, Type) {
    const bin = atob(str), n = bin.length, buf = new Uint8Array(n);
    for (let i = 0; i < n; i++) buf[i] = bin.charCodeAt(i);
    return new Type(buf.buffer);
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    if (!res.body || !total) return res.json();
    const reader = res.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      loading.textContent = 'Memuatkan model 3D… ' + Math.min(99, Math.round(got / total * 100)) + '%';
    }
    const all = new Uint8Array(got); let o = 0;
    for (const p of parts) { all.set(p, o); o += p.length; }
    return JSON.parse(new TextDecoder().decode(all));
  }

  function loadTexture(url) {
    return new Promise((ok, bad) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => bad(new Error('texture'));
      img.src = url;
    });
  }

  function contactShadow(w, d) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'), grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grd.addColorStop(0, 'rgba(0,0,0,0.42)'); grd.addColorStop(0.55, 'rgba(0,0,0,0.16)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
    const tex = new THREE.CanvasTexture(c);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.35, d * 1.9),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.0002; m.renderOrder = -1;
    return m;
  }

  Promise.all([fetchJSON('karipap_mesh.json'), loadTexture('karipap_texture.jpg')])
    .then(([d, img]) => {
      const lo = d.bboxMin, hi = d.bboxMax;
      const q = b64(d.positions, Uint16Array), quv = b64(d.uvs, Uint16Array);
      const pos = new Float32Array(q.length), uv = new Float32Array(quv.length);
      for (let i = 0; i < q.length; i++) { const a = i % 3; pos[i] = lo[a] + q[i] / 65535 * (hi[a] - lo[a]); }
      for (let i = 0; i < quv.length; i++) uv[i] = quv[i] / 65535;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geom.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geom.setIndex(new THREE.BufferAttribute(b64(d.indices, Uint32Array), 1));
      geom.computeBoundingSphere();

      const tex = new THREE.Texture(img);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.needsUpdate = true;
      // unlit: the photographed texture already holds the real light and shadows
      scene.add(new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ map: tex })));
      scene.add(contactShadow(hi[0] - lo[0], hi[2] - lo[2]));

      center.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2);
      fitRadius = geom.boundingSphere.radius;
      homeDist = fitDist();
      controls.minDistance = homeDist * 0.18;
      controls.maxDistance = homeDist * 3;
      controls.maxPolarAngle = Math.PI;      // allow looking at the underside
      controls.target.copy(center);
      camera.position.copy(sph(25, 70, homeDist));
      camera.near = homeDist / 100; camera.far = homeDist * 20; camera.updateProjectionMatrix();
      loading.hidden = true;
      window.__viewerOk = true;
      setTimeout(() => { if (!interacted) setAuto(!reduceMotion); }, 1500);
    })
    .catch(() => fail('Model tidak dapat dimuatkan. Muat semula halaman ini.'));

  controls.addEventListener('start', () => {
    interacted = true; anim = null;
    hint.classList.add('gone');
    setAuto(false);
  });
  setTimeout(() => hint.classList.add('gone'), 6000);
  setAuto(false);

  rotateBtn.addEventListener('click', () => { interacted = true; setAuto(!controls.autoRotate); });
  detailBtn.addEventListener('click', () => {
    interacted = true;
    const on = detailBtn.getAttribute('aria-pressed') !== 'true';
    detailBtn.setAttribute('aria-pressed', String(on));
    setAuto(false);
    // close-up of the crimped edge, where the maker's fingerprints are clearest
    flyTo(on ? sph(180, 62, homeDist * 0.55) : sph(25, 70, homeDist));
  });
  resetBtn.addEventListener('click', () => {
    detailBtn.setAttribute('aria-pressed', 'false');
    flyTo(sph(25, 70, homeDist));
  });

  renderer.setAnimationLoop(() => {
    if (anim) {
      anim.t = Math.min(1, anim.t + 1 / 45);
      const k = 1 - Math.pow(1 - anim.t, 3);
      camera.position.lerpVectors(anim.from, anim.to, k);
      controls.target.lerpVectors(anim.fromT, center, k);
      if (anim.t >= 1) anim = null;
    }
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
